<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mail Counter</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
        <circle cx="16" cy="7" r="2" />
        <circle cx="8" cy="17" r="2" />
      </symbol>
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
      </symbol>
      <symbol id="i-read" viewBox="0 0 24 24">
        <path d="M3 10l9-6 9 6v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM3 10l9 6 9-6" />
      </symbol>
      <symbol id="i-archive" viewBox="0 0 24 24">
        <path d="M3 4h18v5H3zM5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4" />
      </symbol>
      <symbol id="i-spam" viewBox="0 0 24 24">
        <path d="M8.5 3h7L21 8.5v7L15.5 21h-7L3 15.5v-7zM12 8v5M12 16.5v.01" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M8 12.5l2.8 2.8L16 10" />
      </symbol>
    </svg>

    <header>
      <h1 class="brand"><img src="icons/icon-48.png" alt="" />Mail Counter</h1>
      <span id="total" class="pill" hidden></span>
      <span id="checked" class="muted"></span>
      <button id="options" class="icon" type="button" title="Options" aria-label="Options">
        <svg><use href="#i-settings" /></svg>
      </button>
      <button id="refresh" class="icon" type="button" title="Check now" aria-label="Check now">
        <svg><use href="#i-refresh" /></svg>
      </button>
    </header>

    <p id="notice" class="notice" hidden></p>

    <main id="accounts"></main>
    <p id="caught-up" class="caught-up" hidden>
      <svg class="glyph" aria-hidden="true"><use href="#i-check" /></svg>All caught up
    </p>
    <div id="empty" class="empty" hidden>
      <p>No Gmail accounts yet.</p>
      <button id="open-options" class="primary" type="button">Add an account in Options</button>
    </div>

    <template id="account-tpl">
      <section class="account">
        <div class="account-head">
          <button class="account-open" type="button">
            <span class="avatar" aria-hidden="true"></span>
            <span class="email"></span>
            <span class="count"></span>
          </button>
          <button class="reconnect link" type="button" hidden>Reconnect</button>
        </div>
        <p class="account-error" hidden></p>
        <ul class="threads"></ul>
        <button class="more link" type="button" hidden></button>
      </section>
    </template>

    <template id="thread-tpl">
      <li class="thread">
        <button class="thread-main" type="button" aria-expanded="false">
          <span class="avatar sender" aria-hidden="true"></span>
          <span class="line">
            <span class="from"></span>
            <span class="date"></span>
          </span>
          <span class="subject"></span>
          <span class="snippet"></span>
        </button>
        <div class="actions"></div>
        <div class="toolbar" hidden></div>
        <div class="thread-body" hidden>
          <p class="body-status">Loading…</p>
          <button class="show-images link" type="button" hidden>Show images</button>
          <iframe class="body-frame" title="Email" hidden></iframe>
        </div>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
